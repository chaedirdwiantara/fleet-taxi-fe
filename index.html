<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SVG first for browsers that support it (it adapts to the OS colour scheme);
         .ico is the fallback. -->
    <!-- `?v=` is deliberate. Chrome keeps favicons in its own database, keyed by
         URL, which ignores Cache-Control and survives a hard reload — so a mark
         change is invisible until the URL itself changes. Bump this whenever the
         icon artwork changes. -->
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#E01937" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#A3132C" media="(prefers-color-scheme: dark)" />

    <title>Fleet Taxi Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
